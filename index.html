<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<title>Efeito Hall</title>

<style>

/* HTML */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    min-height: 100%;
}

body {
    overflow-y:auto;
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; /* centraliza verticalmente */
    align-items: center;     /* centraliza horizontalmente */
}

main {
    flex: 1;
}

/* Header */
.header {
    background-color: #1e293b;
    color: #f8fafc;
    padding: 16px 5%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    width: 100vw;
    height: 150px;
    margin: 0px 0px 20px 0px
}

.logo {
    font-size: 64px;
    font-weight: bold;
}

.sublogo p{
    font-size: 24px
    /*margin: 0px 0px 0px 50px*/
    border-left: 50px
}

/* Content */
@media(max-width:900px)
{
    main
    {
        flex-direction:column;
    }

    .controls
    {
        width:100%;
    }
}

main {
    width: 90%;
    height: auto;
    margin: 40px auto;
    padding: 24px;
    box-sizing: border-box;
    background-color: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    /*
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    */
    display: flex;
    align-items: center;
    gap: 20px;
    
}

.controls {
    width: 90%;
    
}

#l p {
    font-size: 24px;
}

.rangeValue, .form-range {
    width: 100%;
}

.rangeValue {
    display: flex;
    justify-content: space-between;
}

#three {
    border-radius: 16px;
}

/* Footer */
footer {
  margin-top: auto;
  bottom: 0;
  left: 0;
  width: 100%;
}

.footer {
    flex-shrink: 0;
    width: 100vw;
    height: 120px;
    padding: 24px 5%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    background-color: #0b1120;
    color: #94a3b8;
    border-top: 1px solid #334155;
}

.footer p {
  margin: 0;
}

.footer .name {
    margin: 0px 0px 0px 5px
)

</style>
</head>

<body>

<header class="header">
    <div class="logo">Efeito Hall</div>
    <div class="sublogo"><p>Campos cruzados: o Efeito Hall</p></div>
</header>

<main class="content">
    <div class="render"></div>
    
    <div class="controls">
        <div class="rangeValue" id="l">
            <p>Tensão Hall</p>
            <p class="inputH">0 V</p>
        </div>
        <div class="rangeValue" id="l">
            <p>Corrente elétrica</p>
            <p class="inputA">0 A</p>
        </div>
        <input type="range" class="form-range" min="-10" max="10" value="0" id="iValue">
        <div class="rangeValue">
            <p>-10</p> <p>0</p> <p>10</p>
        </div>
        
        <div class="rangeValue" id="l">
            <p>Campo Magnético</p>
            <p class="inputT">0 T</p>
        </div>
        <input type="range" class="form-range" min="-3" max="3" value="0" id="bValue">
        <div class="rangeValue">
            <p>-3</p> <p>0</p> <p>3</p>
        </div>
    </div>
</main>

<footer class="footer">
    <p class="copy">&copy; 2026 Simulação efeito Hall</p>
    <p class="name">Arthur Amaral</p>
    <p class="name">Diego Braga</p>
    <p class="name">Fernando Maia</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script type="module">

/*
####################################
#           Animate                 
##################################*/

// ############ Imports ############

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

//########### Setting Schemes #############

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// PoV
const camera =
new THREE.PerspectiveCamera(
    75,
    (window.innerWidth * 0.50)/(window.innerWidth * 0.40),
    //1,
    0.1,
    1000
);

camera.position.x = 0;
camera.position.y = 0;
camera.position.z = 5;

/*
window.addEventListener(
    "resize",
    onWindowResize
);

function onWindowResize()
{
    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}
*/

// ############ Renderer ############

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

// Canvas size
renderer.setSize(
    window.innerWidth * 0.50,
    window.innerWidth * 0.40
);

renderer.domElement.id = "three";

document.querySelector(".render").appendChild(renderer.domElement);

// ############ Eixos ############

/*
const axesHelper = new THREE.AxesHelper(5);
scene.add(axesHelper);
*/

// ############ Values ############

//let corrente = iControl.value;
//let magneticZ = 5;
//const magneticStrength = 0.005;
let corrente;
let campo;
let magneticForce;
let electricForce;
let Vh;
const hallStrength = 0.5;
const charge = -1; // Eletron

let boxW = 6
let boxH = 1
let boxP = 1

// ############ Conductor ############

/*
const conductor =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            boxW,    // comprimento
            boxH,    // altura
            boxP   // largura
        ),
        new THREE.MeshPhongMaterial({
            color:0x808080,
            transparent:true,
            opacity:0.3
    })
);
scene.add(conductor);
*/
const boxMaterial =
new THREE.MeshPhongMaterial({
    color: 0x808080,
    transparent: true,
    opacity: 0.05
});

const conductor =
new THREE.Mesh(
    new THREE.BoxGeometry(6,1,1.5),
    boxMaterial
);

scene.add(conductor);

const edges =
new THREE.EdgesGeometry(
    conductor.geometry
);

const edgeLines =
new THREE.LineSegments(
    edges,
    new THREE.LineBasicMaterial({
        color: 0xffffff
    })
);

conductor.add(edgeLines);

//############ Eletrons ############

const electrons = []; // Varios eletrons circulando
for(let i=0; i<50; i++) {
    const electron =
        new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 12, 12),
        new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8
        })
    );

    electron.position.set(
        -2.5 + Math.random()*5,
        -0.4 + Math.random()*0.8,
        -0.4 + Math.random()*0.8
    );

    scene.add(electron);
    electrons.push(electron);
}

//############ Vectors ############


const velocityVector = new THREE.Vector3(0, 0, 0);
const iVector = new THREE.Vector3(0, 0, 0);
const magneticField = new THREE.Vector3(0, 0, 0);
const electricField = new THREE.Vector3(0, 0, 0);

// LorenzForce (Forca magnetica)
function crossForce(charge, vec1, vec2){
    return vec1
        .clone()
        .cross(vec2)
        .multiplyScalar(charge);
}

//############## Eixos (Visuais) #################

// Campo saindo do plano

function createFieldOutOfPlane()
{
    const group = new THREE.Group();

    const ring =
    new THREE.Mesh(
        new THREE.RingGeometry(
            0.11,
            0.14,
            32
        ),
        new THREE.MeshBasicMaterial({
            color:0xffffff,
            side:THREE.DoubleSide
        })
    );
    group.add(ring);

    const center =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            0.035,
            32
        ),
        new THREE.MeshBasicMaterial({
            color:0xffffff
        })
    );
    group.add(center);

    return group;
}

function createFieldIntoPlane()
{
    const group = new THREE.Group();

    const ring =
    new THREE.Mesh(
        new THREE.RingGeometry(
            0.11,
            0.14,
            32
        ),
        new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide
        })
    );

    group.add(ring);

    const material =
    new THREE.LineBasicMaterial({
        color: 0xffffff
    });

    const diagonal1 =
    new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-0.11,-0.11,0),
            new THREE.Vector3( 0.11, 0.11,0)
        ]),
        material
    );

    const diagonal2 =
    new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-0.11, 0.11,0),
            new THREE.Vector3( 0.11,-0.11,0)
        ]),
        material
    );

    group.add(diagonal1);
    group.add(diagonal2);

    return group;
}

const fieldOut =
createFieldOutOfPlane();

const fieldIn =
createFieldIntoPlane();

scene.add(fieldOut);
scene.add(fieldIn);

fieldOut.visible = true;
fieldIn.visible = false;

function updateFieldSymbol()
{
    if(magneticField.z >= 0)
    {
        fieldOut.visible = true;
        fieldIn.visible = false;
    }
    else
    {
        fieldOut.visible = false;
        fieldIn.visible = true;
    }
}

/*
// Multiples of them
for(let x=-2;x <= 2; x+=1){
    for(let y=-1;y<=1;y+=0.5)
    {
        const symbol =
        createFieldOutOfPlane();

        symbol.position.set(
            x,
            y,
            1.2
        );

        scene.add(symbol);
    }
}
*/
//  ############ Ambient ############

const ambientLight =
new THREE.AmbientLight(
    0xffffff,
    0.7
);
scene.add(ambientLight);

const directionalLight =
new THREE.DirectionalLight(
    0xffffff,
    1
);

directionalLight.position.set(
    5,
    5,
    5
);
scene.add(directionalLight);

const iArrow =
new THREE.ArrowHelper(
    iVector.clone(),
    new THREE.Vector3(0,0,0),
    4,
    0x8a2be2
);
scene.add(iArrow);

const fmArrow =
new THREE.ArrowHelper(
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0,0,0),
    4,
    0xff0000
);
scene.add(fmArrow);

// ############# Controls ##############

function updateVh (A, T){
    Vh = Number( (A * T) / (8.5 * 1.6 * 10 ** 6 ));
    let uVh = Number(Vh * 10 ** 6).toFixed(4);
    if(Number.isFinite(Vh)){
        document.querySelector(".inputH").textContent =  uVh + " uV";
    } else {
        document.querySelector(".inputH").textContent = "0 V";
    }
}
let iControl = document.querySelector("#iValue");
iControl.addEventListener("input", (event) => {
    corrente = Number(event.target.value);
    velocityVector.set(corrente * -0.01, 0, 0);
    iVector.set(velocityVector.x, 0, 0);
    document.querySelector(".inputA").textContent = corrente + " A";
    updateVh(corrente, campo);
});

let bControl = document.querySelector("#bValue");
bControl.addEventListener("input", (event) => {
    campo = Number(event.target.value);
    magneticField.set(0, 0, campo * 1.5);
    document.querySelector(".inputT").textContent = campo + " T";
    updateVh(corrente, campo);
    updateFieldSymbol();
});

/*
let eControl = document.querySelector("#eValue");
eControl.addEventListener("input", (event) => {
    const eletrico = Number(event.target.value);
    if(eletrico == 0){
        electricField.set(0,0,0);
        //document.querySelector(".debug").textContent = "caso 0: " + magneticField.z + " " + electricField.z + " " + eletrico;
    } else {
        electricField.set(0, 0, (magneticField.z)*(-1));
        //document.querySelector(".debug").textContent = "caso 1: " + magneticField.z + " " + electricField.z + " " + eletrico;
    }
    
});
*/

function module(num){
    if(num >= 0){
        return {value: num, signal: 0};
    } else {
        return {value: -num, signal: 1};
    }
}


const geometry = conductor.geometry;
const boxL = geometry.parameters.width;
const boxA = geometry.parameters.height;

// ############ Animate ############

function animate()
{
    requestAnimationFrame(animate);
    
    electrons.forEach(electron =>
    {
        magneticForce = crossForce(charge, velocityVector, magneticField);
        electricForce = crossForce(charge, velocityVector, electricField);
       
         // Eixo X
        electron.position.add(
            velocityVector
        );
        iArrow.setDirection(
            iVector.clone().negate().normalize()
        );
        iArrow.setLength(
            iVector.length() * 25
        );

        // Eixo Y
        electron.position.add(
            magneticForce
                .clone()
                .multiplyScalar(0.05)
        );
        electron.position.add(
            electricForce
                .clone()
                .multiplyScalar(0.05)
        );
        
        fmArrow.setDirection(
            magneticForce.clone().normalize()
        );
        fmArrow.setLength(
            magneticForce.length() * 5
        );
        
        // Manter eletron no semi-condutor
        if(electron.position.x > (boxL/2)){
            electron.position.x = electron.position.x * (-1);
        } else if(electron.position.x < -(boxL/2)) {
            electron.position.x = electron.position.x * (-1);
        }
        
        const { value, signal } = module(electron.position.y)
        if(value > (boxA/2)*(0.88)){
            if(signal == 0){
                electron.position.y = (boxA/2)*(0.88);
            } else {
                electron.position.y = -(boxA/2)*(0.88);
            }
            electricField.set(0, 0, (magneticField.z)*(-1));
        } else {
            electricField.set(0, 0, 0.1);
        }
//        if(/*(electron.position.y != 0) && */(electron.position.y > (boxA/2)*(0.88))){
//            electron.position.y = (boxA/2)*(0.88);
//        } else if(){
//        else /*if ((electron.position.y != 0) && (electron.position.y < -(boxA/2)*(0.88)))*/ {
//            electron.position.y = -(boxA/2)*(0.88);
//        } /*else {
//            electron.position.y = 0;
//            document.querySelector(".debug").textContent = "aaaaaaaaaa";
//        } */
        
             
    });
    
    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
